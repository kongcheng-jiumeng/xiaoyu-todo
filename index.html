<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#fdeedd">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小鱼的每日待办">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>小鱼的每日待办</title>
<style>
  :root {
    --accent: #e8935a;
    --accent-2: #f3b57f;
    --accent-dark: #d67c42;
    --bg1: #fdeedd;
    --bg2: #fcf7ef;
    --card: #fffdf9;
    --text: #4a3a2d;
    --muted: #a98f7c;
    --danger: #e26d56;
    --green: #6ab47c;
    --line: #f2e5d6;
    --radius: 18px;
    --shadow: 0 8px 24px rgba(183, 138, 94, .14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(165deg, var(--bg1) 0%, var(--bg2) 55%);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px calc(40px + env(safe-area-inset-bottom));
    min-height: 100%;
  }

  /* 头部 */
  header { padding: 6px 4px 18px; }
  .title-row { display: flex; align-items: center; gap: 8px; }
  .title-row h1 { flex: 1; font-size: 27px; font-weight: 800; letter-spacing: 1px; }
  .fish { width: 46px; height: 32px; flex-shrink: 0; animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .sun { width: 32px; height: 32px; flex-shrink: 0; animation: spin 16s linear infinite; }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  header .date { color: var(--muted); font-size: 14px; margin-top: 6px; }

  /* 统计卡 */
  .stats { display: flex; gap: 12px; margin-bottom: 16px; }
  .stat {
    flex: 1; border-radius: var(--radius); padding: 16px;
    box-shadow: var(--shadow);
  }
  .stat .num { font-size: 28px; font-weight: 800; letter-spacing: .5px; }
  .stat .label { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .stat.pending { background: #fff1ea; }
  .stat.done { background: #eef6ef; }
  .stat.pending .num { color: var(--danger); }
  .stat.done .num { color: var(--green); }

  /* 添加区 */
  .add {
    display: flex; flex-direction: column; gap: 10px;
    background: var(--card); border-radius: var(--radius); padding: 10px;
    box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .add-main { display: flex; gap: 10px; }
  .add-main input {
    flex: 1; border: none; outline: none; font-size: 16px;
    background: transparent; color: var(--text); min-width: 0;
  }
  .add-main input::placeholder { color: #c9b199; }
  .add-main button {
    width: 46px; height: 46px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: #fff; font-size: 26px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(230, 147, 90, .35);
    transition: transform .1s, box-shadow .15s;
  }
  .add-main button:active { transform: scale(.95); background: var(--accent-dark); }
  .add-time {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px dashed var(--line); padding-top: 9px;
  }
  .add-time-label { font-size: 13px; color: var(--muted); }
  .add-time input[type="time"] {
    border: none; outline: none; background: #fdf1e4;
    color: var(--text); font-size: 15px; font-weight: 600;
    border-radius: 10px; padding: 6px 10px; font-family: inherit;
  }

  /* 列表 */
  ul { list-style: none; }
  .empty {
    text-align: center; color: var(--muted); font-size: 14px;
    padding: 44px 0; background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 16px;
  }
  li {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); padding: 15px 14px; border-radius: 16px;
    box-shadow: var(--shadow); margin-bottom: 10px;
    animation: slideIn .2s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .check {
    width: 25px; height: 25px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid #e3c8ad; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #fff; transition: all .15s;
  }
  li.done .check { background: var(--green); border-color: var(--green); }
  .check svg { width: 14px; height: 14px; opacity: 0; }
  li.done .check svg { opacity: 1; }
  li .text {
    flex: 1; font-size: 16px; word-break: break-all; line-height: 1.4;
  }
  li.done .text { color: #c0a790; text-decoration: line-through; }
  li .time {
    flex-shrink: 0; font-size: 12px; font-weight: 600;
    color: var(--accent-dark); background: #fdf1e4;
    border-radius: 20px; padding: 4px 9px;
  }
  li.done .time { color: #c0a790; background: #f6f1e9; }
  li .del {
    border: none; background: none; color: #dcc8b4; font-size: 22px;
    cursor: pointer; width: 32px; height: 32px; line-height: 1;
    border-radius: 8px; flex-shrink: 0; transition: color .15s;
  }
  li .del:active { color: var(--danger); }

  /* 安装到主屏幕提示条 */
  .install-bar {
    display: flex; align-items: center; gap: 10px;
    background: #4a3a2d; color: #fff; border-radius: 16px;
    padding: 12px 14px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .install-bar .msg { flex: 1; font-size: 14px; line-height: 1.5; }
  .install-bar button {
    border: none; border-radius: 10px; padding: 9px 14px;
    font-size: 14px; font-weight: 600; cursor: pointer; flex-shrink: 0;
  }
  .install-bar .do { background: var(--accent); color: #fff; }
  .install-bar .no { background: transparent; color: #d9c8b8; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-row">
      <h1>小鱼的每日待办</h1>
      <svg class="fish" viewBox="0 0 100 68" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M95.5 34C95.5 45.0457 86.5457 54 75.5 54C64.4543 54 55.5 45.0457 55.5 34C55.5 22.9543 64.4543 14 75.5 14C86.5457 14 95.5 22.9543 95.5 34Z" fill="#f3b57f"/>
        <path d="M75.5 54C75.5 54 65 62 50 62C35 62 24.5 54 24.5 54" stroke="#e8935a" stroke-width="3" stroke-linecap="round"/>
        <path d="M24.5 34C24.5 34 15 26 5 26" stroke="#e8935a" stroke-width="3" stroke-linecap="round"/>
        <circle cx="85.5" cy="34" r="3" fill="#4a3a2d"/>
      </svg>
      <svg class="sun" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="30" cy="30" r="12" fill="#f6c85f"/>
        <g stroke="#f6c85f" stroke-width="3" stroke-linecap="round">
          <line x1="30" y1="6" x2="30" y2="14"/>
          <line x1="30" y1="46" x2="30" y2="54"/>
          <line x1="6" y1="30" x2="14" y2="30"/>
          <line x1="46" y1="30" x2="54" y2="30"/>
          <line x1="13" y1="13" x2="19" y2="19"/>
          <line x1="41" y1="41" x2="47" y2="47"/>
          <line x1="13" y1="47" x2="19" y2="41"/>
          <line x1="41" y1="19" x2="47" y2="13"/>
        </g>
      </svg>
    </div>
    <div class="date" id="dateLabel"></div>
  </header>

  <div class="install-bar" id="installBar" style="display:none">
    <div class="msg">可将工作台添加到手机主屏幕，像 App 一样打开</div>
    <button class="do" id="installBtn">添加</button>
    <button class="no" id="installClose">关闭</button>
  </div>

  <section class="stats">
    <div class="stat pending">
      <div class="num" id="countPending">0</div>
      <div class="label">未完成</div>
    </div>
    <div class="stat done">
      <div class="num" id="countDone">0</div>
      <div class="label">已完成</div>
    </div>
  </section>

  <section class="add">
    <div class="add-main">
      <input id="input" type="text" placeholder="添加今日待办..." maxlength="200">
      <button id="addBtn" aria-label="添加">+</button>
    </div>
    <div class="add-time">
      <span class="add-time-label">任务时间（可选）</span>
      <input id="timeInput" type="time">
    </div>
  </section>

  <ul id="list"></ul>
  <div class="empty" id="empty" style="display:none">今天还没有待办，添加一项开始吧</div>
</div>

<script>
(function () {
  var STORAGE_KEY = 'dailyWorkbench.v1';

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  var data = { todos: [] };
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var p = JSON.parse(raw);
        data = { todos: p.todos || [] };
      }
    } catch (e) { data = { todos: [] }; }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  // 跨天处理：未完成事项顺延到今日，清理 7 天前的历史
  function rollover() {
    var today = todayStr();
    var cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 7);
    var cutoffStr = cutoff.getFullYear() + '-' + pad(cutoff.getMonth() + 1) + '-' + pad(cutoff.getDate());

    data.todos = data.todos.filter(function (t) { return t.date >= cutoffStr; });
    data.todos.forEach(function (t) {
      if (t.date < today && !t.done) t.date = today;
    });
    save();
  }

  function todaysTodos() {
    var today = todayStr();
    return data.todos.filter(function (t) { return t.date === today; });
  }
  function find(id) {
    return data.todos.find(function (t) { return t.id === id; });
  }

  // ----- 渲染 -----
  function render() {
    var list = todaysTodos();
    var pending = list.filter(function (t) { return !t.done; });
    var done = list.filter(function (t) { return t.done; });

    document.getElementById('countPending').textContent = pending.length;
    document.getElementById('countDone').textContent = done.length;

    var ul = document.getElementById('list');
    var empty = document.getElementById('empty');
    ul.innerHTML = '';

    if (list.length === 0) {
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      list.forEach(function (t) {
        var li = document.createElement('li');
        if (t.done) li.className = 'done';

        var check = document.createElement('div');
        check.className = 'check';
        check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
        check.addEventListener('click', function () { toggle(t.id); });

        var text = document.createElement('div');
        text.className = 'text';
        text.textContent = t.text;

        var del = document.createElement('button');
        del.className = 'del';
        del.textContent = '\u00d7';
        del.setAttribute('aria-label', '删除');
        del.addEventListener('click', function () { remove(t.id); });

        li.appendChild(check);
        li.appendChild(text);
        if (t.time) {
          var time = document.createElement('div');
          time.className = 'time';
          time.textContent = t.time;
          li.appendChild(time);
        }
        li.appendChild(del);
        ul.appendChild(li);
      });
    }
  }

  function renderDate() {
    var d = new Date();
    var s = d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    document.getElementById('dateLabel').textContent = s;
  }

  // ----- 操作 -----
  function addTodo(text, time) {
    text = (text || '').trim();
    if (!text) return;
    var todo = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      text: text,
      done: false,
      date: todayStr()
    };
    if (time) todo.time = time;
    data.todos.push(todo);
    save();
    render();
  }
  function toggle(id) {
    var t = find(id);
    if (t) { t.done = !t.done; save(); render(); }
  }
  function remove(id) {
    data.todos = data.todos.filter(function (t) { return t.id !== id; });
    save();
    render();
  }

  // ----- 初始化 -----
  function init() {
    load();
    rollover();
    renderDate();

    document.getElementById('addBtn').addEventListener('click', function () {
      var input = document.getElementById('input');
      var timeInput = document.getElementById('timeInput');
      addTodo(input.value, timeInput.value);
      input.value = '';
      timeInput.value = '';
      input.focus();
    });
    document.getElementById('input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('addBtn').click();
    });

    render();

    // 定时刷新，保证跨天后日期与统计更新
    setInterval(function () {
      renderDate();
      rollover();
      render();
    }, 60000);
  }

  // 安装到主屏幕（PWA）
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installBar').style.display = 'flex';
  });
  document.getElementById('installBtn').addEventListener('click', function () {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt = null;
    } else {
      alert('请在浏览器菜单中选择「添加到桌面 / 添加到主屏幕」。');
    }
    document.getElementById('installBar').style.display = 'none';
  });
  document.getElementById('installClose').addEventListener('click', function () {
    document.getElementById('installBar').style.display = 'none';
  });
  window.addEventListener('appinstalled', function () {
    document.getElementById('installBar').style.display = 'none';
  });

  // 注册 Service Worker，实现离线可用
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  init();
})();
</script>
</body>
</html>
